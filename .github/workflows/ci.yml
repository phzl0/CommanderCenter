name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: command_center_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d command_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test_user:disposable-test-password@localhost:5432/command_center_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python3 infra/init_env.py
          sed -i 's/POSTGRES_DB=command_center/POSTGRES_DB=command_center_test/' .env
          docker compose up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Seed disposable account
        run: docker compose exec -T backend python - < infra/seed_test.py
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium dependencies
        working-directory: frontend
        run: |
          # The runner's unrelated Microsoft apt source may return 403.
          # Chromium uses Ubuntu repositories; keep their signature checks enabled.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && rg -q 'packages\.microsoft\.com' "$source"; then
              sudo mv "$source" "$RUNNER_TEMP/$(basename "$source").disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - run: npx playwright test
        working-directory: frontend
      - name: Verify persistence after restart
        run: |
          docker compose restart
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          docker compose exec -T backend python -c 'from app.core.db import SessionLocal; from app.models import Project,ImportFile; from sqlalchemy import select; from app.modules.files import storage_path; db=SessionLocal(); assert db.scalar(select(Project).where(Project.name=="Projeto de teste")); row=db.scalar(select(ImportFile)); assert row and storage_path(row.stored_name).exists(); print("Banco e arquivos persistiram após reinício")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: frontend/test-results/
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
